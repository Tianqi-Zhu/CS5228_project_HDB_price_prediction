# Core environment for routine experiments and the final ensemble.
# Current Windows/NVIDIA setup; optional author models are listed separately.
# Create: conda env create -f environment.yml
name: cs5228
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - numpy==2.4.6
      - pandas==3.0.5
      - scipy==1.17.1
      - scikit-learn==1.9.0
      - joblib>=1.3
      - catboost==1.2.10
      - lightgbm==4.7.0
      - xgboost==3.2.0
      - torch==2.11.0+cu128
      - rtdl-revisiting-models==0.0.2
      - rtdl-num-embeddings==0.0.12
      - pytorch-tabnet==4.1.0
      - matplotlib>=3.7
      - pillow>=9.0
      - openpyxl>=3.1
      - reportlab>=4.0
      - threadpoolctl>=3.5
